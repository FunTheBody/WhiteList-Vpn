name: 🔄 Auto Update Subscriptions

on:
  schedule:
    # Запуск каждый час (cron в UTC)
    - cron: '0 * * * *'
  workflow_dispatch:  # Возможность запустить вручную

permissions:
  contents: write  # Право на коммит изменений

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Run merger script
        run: python main.py
        env:
          # Если нужны прокси для загрузки, раскомментируйте:
          # HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          # HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}

      - name: 💾 Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          if ! git diff --quiet output/; then
            git add output/
            git commit -m "🔄 Auto-update: $(date '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
            echo "✅ Подписка обновлена и запушена"
          else
            echo "ℹ️ Изменений нет, пропуск коммита"
          fi

      - name: 📢 Notify on failure
        if: failure()
        run: |
          echo "❌ Ошибка обновления подписки!"
          # Здесь можно добавить отправку уведомления в Telegram и т.д.